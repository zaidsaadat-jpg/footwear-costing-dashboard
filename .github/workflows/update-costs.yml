name: Update Material Costs

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run cost fetcher
        run: python fetch_costs.py
      - name: Commit updated costs
        run: |
          git config user.name "Cost Bot"
          git config user.email "bot@example.com"
          git add cost_data.json
          git commit -m "Update material costs" || echo "No changes to commit"
          git push
